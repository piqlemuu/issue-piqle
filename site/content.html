<style>
.ctabs{display:grid;grid-template-columns:repeat(3,1fr);gap:.375rem;margin-top:.875rem}
.ctabs button{min-height:2.75rem;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:.9375rem;font-weight:600;cursor:pointer;color:var(--text)}
.ctabs button[aria-selected=true]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.sub-chips{display:flex;gap:.375rem;margin-top:.625rem}
.sub-chips:empty{display:none}
.sub-chips button{min-height:2.75rem;padding:0 1rem;border:1px solid var(--line);background:var(--card);border-radius:999px;font-weight:600;cursor:pointer;font-size:.9375rem}
.sub-chips button[aria-pressed=true]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.vrow{grid-template-columns:1.75rem 6.5rem minmax(0,1fr) auto;align-items:center}
.vth{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--soft);display:block}
.vth img{width:100%;height:100%;object-fit:cover;display:block}
.vth .play{width:1.75rem;height:1.75rem}
.t2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.9375rem;font-weight:600;line-height:1.45}
.meta.g{color:var(--red);font-weight:600}
@media (max-width:359px){.vrow{grid-template-columns:1.5rem 5rem minmax(0,1fr) auto;gap:.5rem}}
</style>

<body>
<header class="top">
  <div class="wrap top-in">
    <div class="logo"><a href="index.html">이슈<span>피클</span></a></div>
    <button class="icon-btn" id="settings-btn" aria-label="화면 설정" aria-haspopup="dialog" aria-controls="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <p class="status"><i class="dot" aria-hidden="true"></i><span id="updated">불러오는 중…</span></p>
  <div class="alert" id="alert" role="alert" hidden><span>콘텐츠 순위를 불러오지 못했어요.</span><button id="retry">다시 시도</button></div>
  <h1 class="sr">콘텐츠 랭킹</h1>
  <div class="ctabs" id="tabs" role="tablist" aria-label="콘텐츠 종류">
    <button role="tab" data-t="youtube">유튜브</button><button role="tab" data-t="boxoffice">박스오피스</button><button role="tab" data-t="netflix">넷플릭스</button>
  </div>
  <div class="sub-chips" id="chips"></div>

  <!-- ▼ [광고 설정 2] 목록 위 광고 -->
  <div class="ad-slot" id="ad-1"></div>

  <p class="note" id="desc"></p>
  <div class="box" style="margin-top:.5rem"><ol class="rlist" id="list"><li class="state">불러오는 중…</li></ol></div>
  <button class="more" id="more" hidden></button>

  <!-- ▼ [광고 설정 3] 목록 아래 광고 -->
  <div class="ad-slot" id="ad-2"></div>

  <footer class="foot">
    <p><b>이슈피클</b> — 유튜브 영상은 YouTube 공식 API, 박스오피스는 영화진흥위원회 통합전산망, 넷플릭스는 넷플릭스 공식 주간 TOP 10 자료를 바탕으로 해요.</p>

    <p>© 2026 이슈피클</p>
  </footer>
</main>

<nav class="bnav" data-here="content"></nav>
<script src="ui.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url = u => /^https?:\/\//.test(u || "") ? u : "#";
function kn(n) {                       // 1234567 → 123만
  if (n == null) return "";
  if (n >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, "") + "억";
  if (n >= 1e5) return Math.round(n / 1e4) + "만";
  if (n >= 1e4) return (n / 1e4).toFixed(1).replace(/\.0$/, "") + "만";
  return n.toLocaleString("ko-KR");
}
function chg(c) {
  if (c === "new") return '<small><span class="lbl new">NEW</span></small>';
  if (c > 0) return `<small class="chg up" style="margin:0">▲${c}</small>`;
  if (c < 0) return `<small class="chg down" style="margin:0">▼${-c}</small>`;
  return '<small class="chg same" style="margin:0">–</small>';
}
const PLAY = '<svg class="play" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="rgba(0,0,0,.55)"/><path d="M19 15l14 9-14 9z" fill="#fff"/></svg>';
const M = (...a) => a.filter(Boolean).map(x => `<span class="nw">${x}</span>`).join(" · ");
const YT_CHIPS = ["전체", "기타", "뉴스·정치", "음악", "스포츠", "엔터", "영화·애니", "게임", "인물"];
let D = null, tab = "youtube", chip = "전체", nfChip = "tv", limit = 30;

function setTab(t) {
  tab = ["youtube", "boxoffice", "netflix"].includes(t) ? t : "youtube";
  limit = 30;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.t === tab));
  try { history.replaceState(null, "", "#" + tab); } catch (e) {}
  render();
}

function emptyBox(msg) { $("list").innerHTML = `<li class="state">${msg}</li>`; $("more").hidden = true; }

function renderYoutube() {
  $("chips").innerHTML = "";          // 분야 버튼 없이 전체만 보여줌
  const all = (D.youtube || []);
  if (!all.length) return emptyBox("유튜브 순위를 준비 중이에요.<br>(운영자: README 5단계에서 유튜브 키를 넣어 주세요)");
  const list = all.slice(0, 100);
  $("desc").textContent = `최근 ${D.youtube_hours || 6}시간 사이 조회수가 많이 오른 순서예요 · 한국 유튜브 인기 영상 기준`;
  if (!list.length) return emptyBox("이 분야의 영상이 아직 없어요.");
  $("list").innerHTML = list.slice(0, limit).map((v, i) => `
    <li><a class="row vrow" href="${esc(url(v.link))}" target="_blank" rel="noopener" aria-label="${esc(v.title)} (유튜브에서 보기)">
      <span class="rank">${v.rank}</span>
      <span class="vth">${v.thumb ? `<img src="${esc(url(v.thumb))}" alt="" loading="lazy">` : ""}${PLAY}</span>
      <span class="mid"><span class="t2">${esc(v.title)}</span>
        <span class="meta">${M(esc(v.channel), v.subs ? "구독 " + kn(v.subs) : "", `조회수 ${kn(v.views)}회`)}</span>
        ${v.gain != null ? `<span class="meta g">▲${kn(v.gain)}회 · 최근 ${v.hrs}시간</span>` : ""}</span>
      <span class="end">${chg(v.change)}</span>
    </a></li>`).join("");
  $("more").hidden = list.length <= limit;
  $("more").textContent = `${Math.min(list.length, limit + 30)}위까지 더 보기`;
}

function renderBox() {
  $("chips").innerHTML = "";
  const bo = D.boxoffice;
  if (!bo || !bo.items?.length) return emptyBox("박스오피스 순위를 준비 중이에요.<br>(운영자: README 6단계에서 영화진흥위원회 키를 넣어 주세요)");
  const d = new Date(bo.date);
  $("desc").textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 하루 관객 수 기준 순위예요 · 영화진흥위원회 통합전산망`;
  $("list").innerHTML = bo.items.map(m => `
    <li><a class="row" href="https://search.naver.com/search.naver?query=${encodeURIComponent("영화 " + m.title)}" target="_blank" rel="noopener">
      <span class="rank">${m.rank}</span>
      <span class="mid"><span class="t2">${esc(m.title)}</span>
        <span class="meta">${M(`개봉 ${esc(m.open)}`, `누적 ${kn(m.acc)}명`, m.share ? "매출 점유 " + esc(m.share) + "%" : "")}</span></span>
      <span class="end"><b>${kn(m.audi)}명</b><small>하루 관객</small>${chg(m.change)}</span>
    </a></li>`).join("");
  $("more").hidden = true;
}

function renderNetflix() {
  $("chips").innerHTML = [["tv", "시리즈"], ["films", "영화"]].map(([k, n]) =>
    `<button aria-pressed="${k === nfChip}" data-nf="${k}">${n}</button>`).join("");
  const nf = D.netflix;
  if (!nf || !(nf[nfChip] || []).length) return emptyBox("넷플릭스 순위를 준비 중이에요. 잠시 후 다시 확인해 주세요.");
  const end = new Date(nf.week), start = new Date(end - 6 * 864e5);
  const f = d => `${d.getMonth() + 1}/${d.getDate()}`;
  $("desc").textContent = `${f(start)} ~ ${f(end)} 한 주 동안 한국에서 많이 본 넷플릭스 ${nfChip === "tv" ? "시리즈" : "영화"}예요 · 넷플릭스 공식 TOP 10 (매주 화요일 갱신)`;
  $("list").innerHTML = nf[nfChip].map(m => `
    <li><a class="row" href="https://www.netflix.com/search?q=${encodeURIComponent(m.title)}" target="_blank" rel="noopener">
      <span class="rank">${m.rank}</span>
      <span class="mid"><span class="t2">${esc(m.season || m.title)}</span><span class="meta">${m.weeks}주째 TOP 10</span></span>
      <span class="end">${chg(m.change)}</span>
    </a></li>`).join("");
  $("more").hidden = true;
}

function render() {
  if (!D) return;
  $("desc").textContent = "";
  ({youtube: renderYoutube, boxoffice: renderBox, netflix: renderNetflix})[tab]();
}

$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) setTab(b.dataset.t); };
$("chips").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.c) { chip = b.dataset.c; limit = 30; }
  if (b.dataset.nf) nfChip = b.dataset.nf;
  render();
};
$("more").onclick = () => { limit += 30; render(); };


async function load() {
  try {
    D = window.__CONTENT__ || await (await fetch("content.json?t=" + Date.now())).json();
    const d = new Date(D.updated);
    $("updated").textContent = d.toLocaleString("ko-KR", {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"}) + " 업데이트";
    $("alert").hidden = true;
  } catch (e) {
    D = {}; $("updated").textContent = "업데이트 정보를 불러오지 못했어요"; $("alert").hidden = false;
  }
  render();
}
setTab(location.hash.slice(1));
$("retry").onclick = load;
load();
setInterval(load, 10 * 60 * 1000);
</script>
</body>
