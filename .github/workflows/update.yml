name: 이슈 자동 수집

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: issue-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 지난번 결과 가져오기
        run: |
          curl -fsSL --retry 3 --max-time 30 \
            "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/data.json?t=$(date +%s)" \
            -o /tmp/prev.json \
          && python -c "import json;json.load(open('/tmp/prev.json'))" \
          && cp /tmp/prev.json site/data.json \
          && echo "지난번 결과를 사이트에서 받았어요" \
          || echo "지난번 결과를 못 받아서 저장소에 있는 예전 파일로 진행해요"

      - name: 뉴스·검색어·영상 수집 + 검색용 정적 페이지
        run: python collect.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}

      - name: 홈페이지에 오리지널 해설 링크 자동 반영
        run: python home_editorial.py

      - name: 메인 로고 아래 쿠팡파트너스 광고 배치
        run: python inject_coupang_banner.py

      - name: 유튜브 순위 검색용 HTML 자동 생성
        run: python youtube_seo.py

      - name: 일정·새콤해설 검색용 HTML 보강
        run: python section_seo.py

      - name: 블랙프라이데이 새콤해설 발행 및 본문 중간 광고 배치
        run: python publish_blackfriday.py

      - name: 배포 전 SEO 자동 점검 (경고·보고)
        run: |
          python seo_audit.py \
            --site site \
            --output seo-audit-report.json \
            --summary seo-audit-report.md

      - name: SEO 점검 결과 다운로드 파일 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            seo-audit-report.json
            seo-audit-report.md
          if-no-files-found: ignore
          retention-days: 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
