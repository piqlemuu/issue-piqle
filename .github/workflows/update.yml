name: 이슈 자동 수집

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: issue-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 지난번 결과 가져오기
        run: |
          curl -fsSL --retry 3 --max-time 30 \
            "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/data.json?t=$(date +%s)" \
            -o /tmp/prev.json \
          && python -c "import json;json.load(open('/tmp/prev.json'))" \
          && cp /tmp/prev.json site/data.json \
          && echo "지난번 결과를 사이트에서 받았어요" \
          || echo "지난번 결과를 못 받아서 저장소에 있는 예전 파일로 진행해요"

      - name: 뉴스·검색어·영상 수집 + 검색용 정적 페이지
        run: python collect.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}

      - name: 홈페이지에 오리지널 해설 링크 자동 반영
        run: python home_editorial.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
