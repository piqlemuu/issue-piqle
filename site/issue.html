<script src="ui.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url = u => /^https?:\/\//.test(u || "") ? u : "#";
const tempWord = t => t >= 80 ? "뜨거움" : t >= 60 ? "들썩임" : t >= 40 ? "따끈함" : "잔잔함";
const lv = (n, [a, b, c]) => n >= a ? "lv4" : n >= b ? "lv3" : n >= c ? "lv2" : "lv1";
const CATS = {"연예": "ent", "스포츠": "spo", "생활·경제": "life", "음식·카페": "food", "뷰티·패션": "beauty", "쇼핑·혜택": "shop", "여행·공간": "trip", "문화·여가": "cul", "IT·테크": "it", "시사": "sisa"};
const M = (...a) => a.filter(Boolean).map(x => `<span class="nw">${x}</span>`).join(" · ");
const EXT = '<span class="ext" aria-hidden="true">원문 ↗</span>';
function ago(iso) {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "방금"; if (m < 60) return m + "분 전";
  const h = Math.floor(m / 60); return h < 24 ? h + "시간 전" : Math.floor(h / 24) + "일 전";
}
const link = k => "issue.html?k=" + encodeURIComponent(k);
function chg(c) {
  if (c === "new") return ' <span class="lbl new">NEW</span>';
  if (c > 0) return ` <span class="chg up">▲${c}</span>`;
  if (c < 0) return ` <span class="chg down">▼${-c}</span>`;
  return "";
}

function chart(h, t) {                     // 온도 추이 (30분마다 한 점)
  const wait = `<p class="state">기록이 쌓이는 중이에요. 30분마다 한 점씩 늘어나요.</p>`;
  if (!h || h.length < 2) return wait;
  const W = 320, H = 130, P = 16;
  const ts = h.map(x => new Date(x[0]).getTime()), t0 = Math.min(...ts), t1 = Math.max(...ts);
  if (t1 - t0 < 10 * 60000) return wait;
  const xs = ts.map(v => P + (W - 2 * P) * ((v - t0) / (t1 - t0)));
  const vals = h.map(x => x[1]), lo = Math.max(0, Math.min(...vals) - 8), hi = Math.min(100, Math.max(...vals) + 8);
  const ys = h.map(x => H - 24 - (H - 48) * ((x[1] - lo) / Math.max(hi - lo, 1)));
  const line = xs.map((x, i) => `${i ? "L" : "M"}${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(" ");
  const hrs = ((t1 - t0) / 36e5).toFixed(1).replace(/\.0$/, "");
  const lx = xs[xs.length - 1], ly = ys[ys.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 ${hrs}시간 온도 추이, 지금 ${t}도">
    <line x1="${P}" y1="${H - 24}" x2="${W - P}" y2="${H - 24}" stroke="var(--line)"/>
    <path d="${line}" stroke="var(--text)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="4" fill="var(--text)"/>
    <text x="${Math.min(lx, W - 24)}" y="${ly - 10}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">${t}°</text>
    <text x="${P}" y="${H - 6}" font-size="11" fill="var(--sub)">${hrs}시간 전</text>
    <text x="${W - P}" y="${H - 6}" font-size="11" fill="var(--sub)" text-anchor="end">지금</text></svg>`;
}

let D = null, E = null, VIDEOS = [];
function findThumb(word) {
  const w = String(word || "").toLowerCase();
  if (w.length < 2) return "";
  const v = VIDEOS.find(x => x.title && x.title.toLowerCase().includes(w));
  return v ? v.thumb : "";
}
function render(k) {
  E = D.issues[k];
  if (!E) {
    $("main").innerHTML = `<div class="box state" style="margin-top:.75rem">이 이슈는 지금 순위에서 빠졌어요.<a class="more" href="index.html">지금 뜨는 이슈 보기 ›</a></div>`;
    return;
  }
  document.title = `${E.title || E.keyword} - 지금 왜 화제일까? | 이슈피클`;
  const names = {news: "뉴스", search: "검색", video: "영상", community: "커뮤니티"}, sig = E.signals || {};
  const kinds = Object.keys(names).filter(x => sig[x] != null);
  const cat = E.cat ? `<span class="lbl cat c-${CATS[E.cat.name] || ""}" style="margin:0">${esc(E.cat.name)}</span> ${E.cat.rank}위` : E.kind === "인물" ? "화제의 인물" : "이슈";
  const rank = E.rank ? `실시간 ${E.rank}위${chg(E.change)}` : "";
  const lead = E.news?.[0];
  const img = E.img || E.news.find(n => n.img)?.img || findThumb(E.keyword);
  const others = E.source_names.length < E.sources ? ` 외 ${E.sources - E.source_names.length}곳` : "";
  let same = [];
  if (E.cat && D.cats?.[E.cat.id]) same = D.cats[E.cat.id].list.filter(x => x !== k && D.issues[x]).slice(0, 4);
  $("main").innerHTML = `
    <p class="crumb">${M(cat, rank, `${new Date(D.updated).toLocaleString("ko-KR", {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"})} 업데이트`)}</p>
    <h1 class="ititle">${esc(E.title || E.keyword)}</h1>
    ${E.explain ? `<section class="box exbox" aria-labelledby="h-ex"><h2 id="h-ex">📝 절임장 해설</h2><ul>${E.explain.summary.map(x => `<li>${esc(x)}</li>`).join("")}</ul><a href="${esc(E.explain.url)}">해설 전체 보기 ›</a></section>` : ""}

    <a class="box lead ${img ? "has-img" : ""}" href="${esc(url(lead?.link))}" target="_blank" rel="noopener nofollow" aria-label="대표 기사 원문 보기 (새 창): ${esc(E.headline)}">
      ${img ? `<span class="ph"><img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" decoding="async" onerror="this.closest('.lead').classList.remove('has-img');this.parentNode.remove()"></span>` : ""}
      <span><span class="ltt">${esc(E.headline)}</span>
        <small>${M(lead ? esc(lead.source) : "", lead ? ago(lead.time) : "")} ${EXT}</small></span>
    </a>

    <div class="box kpis">
      <div><b class="${lv(E.temp, [80, 60, 40])}">${E.temp}°</b><small>온도 · ${tempWord(E.temp)}</small></div>
      <div><b>${E.sources}곳</b><small>보도한 언론사</small></div>
      <div><b>${E.articles}건</b><small>관련 기사</small></div>
    </div>
    <button class="share" id="share">이 이슈 공유하기</button>

    <section class="sec"><div class="sec-head"><div><h2>관련 기사</h2><p>누르면 언론사 원문이 새 창으로 열려요</p></div></div>
      <div class="box"><ul class="nlist">${E.news.map(n => `<li><a class="${n.img ? "has-img" : ""}" href="${esc(url(n.link))}" target="_blank" rel="noopener nofollow">
        ${n.img ? `<img class="nth" src="${esc(n.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" decoding="async" onerror="this.parentNode.classList.remove('has-img');this.remove()">` : ""}<span><span class="tt">${esc(n.title)}</span><small>${M(esc(n.source), ago(n.time))}</small></span>${EXT}<span class="sr">(새 창에서 원문 열기)</span></a></li>`).join("")}</ul></div></section>

    <section class="sec"><div class="sec-head"><div><h2>커뮤니티 관련글</h2><p>최근 24시간 ${esc((D.community_sites || []).join("·") || "커뮤니티")} 글 중 제목에 '${esc(E.keyword)}'가 들어간 글이에요</p></div></div>
      <div class="box">${(E.community || []).length ? `<ul class="nlist">${E.community.map(c => `<li><a href="${esc(url(c.link))}" target="_blank" rel="noopener nofollow">
        <span><span class="tt">${esc(c.title)}</span><small>${M(esc(c.src), c.time ? ago(c.time) : "")}</small></span>${EXT}<span class="sr">(새 창에서 원문 열기)</span></a></li>`).join("")}</ul>`
        : `<p class="state">아직 커뮤니티에서 이 키워드가 들어간 글을 찾지 못했어요.</p>`}</div>
      <p class="note">글 제목과 링크만 보여 드리고 내용은 저장하지 않아요. 커뮤니티 글은 개인 의견이라 사실과 다를 수 있어요.</p></section>

    <section class="sec"><div class="sec-head"><div><h2>온도 추이</h2><p>30분마다 잰 온도예요</p></div></div>
      <div class="box chart">${chart(E.hist, E.temp)}</div></section>

    ${same.length ? `<section class="sec"><div class="sec-head"><div><h2>연관 이슈</h2><p>같은 ${esc(E.cat.name)} 분야의 다른 이슈예요</p></div></div>
      <div class="box"><ol class="rlist">${same.map(x => { const o = D.issues[x];
        return `<li><a class="row" href="${link(x)}"><span class="rank">${o.cat ? o.cat.rank : "·"}</span><span class="mid"><span class="kw">${esc(o.title || o.keyword)}</span>${chg(o.change)}<span class="hl">${esc(o.headline)}</span><span class="meta">${M(`매체 ${o.sources}곳`, `기사 ${o.articles}건`)}</span></span><span class="end"><b class="${lv(o.temp, [80, 60, 40])}">${o.temp}°</b><small>${tempWord(o.temp)}</small></span></a></li>`; }).join("")}</ol></div></section>` : ""}

    <section class="sec">
      <details class="box how"><summary>집계 방식·출처 안내</summary><div class="in">
        <p><b>온도</b>는 최근 24시간 동안 여러 언론사가 이 이슈를 얼마나 함께 다뤘는지를 30~100으로 나타낸 값이에요. 가장 많이 다뤄진 이슈가 100°예요.</p>
        <p><b>확인한 신호 종류</b>: ${kinds.map(x => names[x]).join(" · ") || "뉴스"} (${kinds.length || 1}종류)<br>
           <b>보도한 언론사</b>: ${E.sources}곳 — ${esc(E.source_names.join(", "))}${others}</p>
        <div class="box" style="box-shadow:none"><ol class="rlist">${Object.keys(names).map(x => `<li><div class="row" style="grid-template-columns:5rem minmax(0,1fr) auto;align-items:center;padding:.625rem .875rem"><span>${names[x]}</span><span class="meta" style="margin:0">${sig[x] == null ? "신호 없음" : "신호 세기 0~100 중"}</span><span class="end"><b style="font-size:1rem">${sig[x] == null ? "–" : sig[x]}</b></span></div></li>`).join("")}</ol></div>
        ${E.evidence?.filter(v => v.type !== "커뮤니티").length ? `<p style="margin-top:.875rem"><b>뉴스 밖 근거</b></p><ul class="nlist">${E.evidence.filter(v => v.type !== "커뮤니티").map(v => `<li><a href="${esc(url(v.link))}" target="_blank" rel="noopener nofollow" style="padding:.625rem 0"><span><span class="lbl cat">${esc(v.type)}</span><span class="tt">${esc(v.title)}</span></span>${EXT}</a></li>`).join("")}</ul>` : ""}
        <p>기사 제목과 링크만 보여드리며, 기사 저작권은 각 언론사에 있어요. <a href="about.html" style="text-decoration:underline">이슈피클이란?</a></p>
      </div></details>
    </section>`;
  $("share").onclick = async () => {
    const data = {title: `${E.title || E.keyword} — 지금 ${E.temp}° | 이슈피클`, url: location.href};
    try { if (navigator.share) { await navigator.share(data); return; } } catch (e) { return; }
    try { await navigator.clipboard.writeText(location.href); } catch (e) {}
    $("toast").classList.add("on"); setTimeout(() => $("toast").classList.remove("on"), 1600);
  };
}

$("back").onclick = e => { if (history.length > 1 && document.referrer) { e.preventDefault(); history.back(); } };

async function load() {
  const k = new URLSearchParams(location.search).get("k") || "";
  try {
    D = window.__ISSUES__ || await (await fetch("issues.json?t=" + Date.now())).json();
    try { VIDEOS = (await (await fetch("content.json?t=" + Date.now())).json()).youtube || []; } catch (e) {}
    render(k);
  } catch (e) {
    $("main").innerHTML = `<div class="alert" role="alert"><span>이슈 정보를 불러오지 못했어요.</span><button id="retry">다시 시도</button></div>`;
    $("retry").onclick = load;
  }
}
load();
</script>
