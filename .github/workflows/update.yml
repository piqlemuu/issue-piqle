name: 이슈 자동 수집

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: issue-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 뉴스·검색어·영상 수집
        run: python collect.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}

      - name: 결과 저장
        run: |
          git config user.name "issue-bot"
          git config user.email "issue-bot@users.noreply.github.com"
          git add site/data.json
          git diff --staged --quiet || git commit -m "이슈 갱신 [skip ci]"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
